# Exemple de carte Lovelace pour une chaîne (ex. France Inter).
# Remplace les entity_id par ceux générés pour ton instance.
#
# Carte Markdown : native HA core, templates Jinja2 supportés nativement,
# pas de dépendance HACS (contrairement à picture-elements qui a besoin de
# config-template-card pour templater l'image). Recommandé ici car
# l'affichage kiosk principal (Kindle/iPad) passe par du HTML custom + WS
# direct, pas par Lovelace — cette carte n'est qu'un confort pour le
# dashboard HA lui-même.
#
# <img> en HTML brut plutôt que la syntaxe ![]() pure : permet de fixer
# la taille d'affichage (la syntaxe markdown pure ne le permet pas).
type: markdown
content: >
  ## {{ states('sensor.rf_live_france_inter_en_cours') }}

  {{ state_attr('sensor.rf_live_france_inter_en_cours', 'jour') }}


  <img src="{{ state_attr('sensor.rf_live_france_inter_en_cours', 'image') }}" width="268">


  ---


  **À suivre :** {{ states('sensor.rf_live_france_inter_suivant') }}
  — {{ state_attr('sensor.rf_live_france_inter_suivant', 'jour') }}
