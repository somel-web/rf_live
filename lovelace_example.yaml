# Exemple de carte Lovelace pour une chaîne (ex. France Inter).
# Remplace les entity_id par ceux générés pour ton instance.
#
# Limite HA native : la carte `picture-elements` standard ne permet PAS
# de templater le champ `image:` avec un attribut d'entité. Solution :
# "config-template-card" (HACS).
type: custom:config-template-card
entities:
  - sensor.rf_live_france_inter_en_cours
card:
  type: picture-elements
  image: >-
    ${states['sensor.rf_live_france_inter_en_cours'].attributes.image}
  elements:
    - type: state-label
      entity: sensor.rf_live_france_inter_en_cours
      attribute: jour
      style:
        top: 85%
        left: 5%
        color: white
        font-weight: bold
        text-shadow: 0 0 4px black
    - type: state-label
      entity: sensor.rf_live_france_inter_en_cours
      style:
        top: 92%
        left: 5%
        color: white
        font-size: 0.8em
        text-shadow: 0 0 4px black
