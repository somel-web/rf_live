# Exemple de carte Lovelace pour une chaîne (ex. France Inter).
# Remplace les entity_id par ceux générés pour ton instance.
#
# --- Option 1 : Markdown (recommandée si tu veux éviter toute dépendance) ---
# Native HA core, templates Jinja2 supportés nativement, pas de dépendance
# HACS. Recommandé ici car l'affichage kiosk principal (Kindle/iPad) passe
# par du HTML custom + WS direct, pas par Lovelace — cette carte n'est
# qu'un confort pour le dashboard HA lui-même.
#
# <img> en HTML brut plutôt que la syntaxe ![]() pure : permet de fixer
# la taille d'affichage (la syntaxe markdown pure ne le permet pas).
type: markdown
content: >
  ## {{ states('sensor.france_inter_en_cours') }}

  {{ state_attr('sensor.france_inter_en_cours', 'jour') }}


  <img src="{{ state_attr('sensor.france_inter_en_cours', 'image') }}" width="268">


  ---


  **À suivre :** {{ states('sensor.france_inter_suivant') }}
  — {{ state_attr('sensor.france_inter_suivant', 'jour') }}

---
# --- Option 2 : image en fond, bandeau opaque avec le jour en bas ---
# Nécessite "config-template-card" (HACS) : picture-elements seule ne
# permet pas de templater le champ image: avec un attribut d'entité.
# Nécessite aussi "card_mod" (HACS) : le composant interne state-label
# de HA applique white-space: nowrap + overflow: hidden + text-overflow:
# ellipsis sur un nœud qu'un simple style: inline ne peut pas atteindre
# (même avec !important) — card_mod injecte une vraie balise <style>
# dans le shadow DOM du composant, qui elle est bien prioritaire.
# Le nom de l'émission n'est pas dupliqué en overlay : il est déjà présent
# visuellement dans l'image fournie par l'API.
# Validé en conditions réelles (voir capture du 13/08/2026, texte long
# sur 2 lignes, wrap et centrage corrects).
type: custom:config-template-card
entities:
  - sensor.france_inter_en_cours
card:
  type: picture-elements
  image: >-
    ${states['sensor.france_inter_en_cours'].attributes.image}
  elements:
    - type: state-label
      entity: sensor.france_inter_en_cours
      attribute: jour
      style:
        top: 85%
        left: 0%
        right: 0%
        height: 15%
        transform: initial
        background-color: rgba(0, 0, 0, 0.4)
        color: white
        font-size: 0.9em
        display: flex
        align-items: center
        justify-content: center
        text-align: center
      card_mod:
        style: |
          div {
            white-space: normal !important;
            overflow: visible !important;
            text-overflow: clip !important;
          }
